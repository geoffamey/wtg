version: '3'

tasks:
  lint:
    desc: Run golangci-lint
    cmd: golangci-lint run ./...

  test:
    desc: Run all tests
    cmd: go tool gotestsum -- ./...

  test:race:
    desc: Run all tests with the race detector
    cmd: go tool gotestsum -- -race ./...

  test:coverage:
    desc: Run all tests with coverage report
    cmds:
      - go tool gotestsum -- -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  fmt:
    desc: Format all Go source files
    cmd: gofmt -w .
